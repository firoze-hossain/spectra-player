[package]
name = "nova-player-app"
version = "0.1.0"
edition = "2021"
authors = ["Md. Firoze Hossain <firoze.hossain@outlook.com>"]
description = "Nova Player standalone desktop media player for Linux, NovaOS, and POSIX systems."
license = "MIT"
repository = "https://github.com/firoze-hossain/nova-player"

[[bin]]
name = "nova-player"
path = "src/main.rs"

[features]
default = ["std"]
std = ["nova-player-core/std", "nova-player-ui/std"]

[dependencies]
nova-player-core = { path = "../nova-player-core", default-features = false }
nova-player-ui = { path = "../nova-player-ui", default-features = false }
x11rb = "0.14.0"
