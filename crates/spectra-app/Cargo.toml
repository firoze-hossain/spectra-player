[package]
name = "spectra-app"
version = "0.1.0"
edition = "2021"
authors = ["Md. Firoze Hossain <firoze.hossain@outlook.com>"]
description = "Spectra standalone desktop media studio & player for Linux, NovaOS, and POSIX systems."
license = "MIT"
repository = "https://github.com/firoze-hossain/spectra-player"

[[bin]]
name = "spectra"
path = "src/main.rs"

[features]
default = ["std"]
std = ["spectra-core/std", "spectra-ui/std"]

[dependencies]
spectra-core = { path = "../spectra-core", default-features = false }
spectra-ui = { path = "../spectra-ui", default-features = false }
winit = "0.30.13"
softbuffer = "0.4.8"
rfd = "0.18.0"
arboard = { version = "3.7.0", default-features = false }
libloading = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18.2"
