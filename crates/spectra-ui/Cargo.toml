[package]
name = "spectra-ui"
version = "0.1.0"
edition = "2021"
authors = ["Md. Firoze Hossain <firoze.hossain@outlook.com>"]
description = "Hardware-agnostic modern acrylic UI, video canvas, audio visualizers, and interactive controls for Spectra Media Studio."
license = "MIT"
repository = "https://github.com/firoze-hossain/spectra-player"

[features]
default = ["std"]
std = ["spectra-core/std"]

[dependencies]
spectra-core = { path = "../spectra-core", default-features = false }
