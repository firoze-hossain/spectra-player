[package]
name = "nova-player-ui"
version = "0.1.0"
edition = "2021"
authors = ["Md. Firoze Hossain <firoze.hossain@outlook.com>"]
description = "Hardware-agnostic modern acrylic UI, video canvas, audio visualizers, and interactive controls for Nova Player."
license = "MIT"
repository = "https://github.com/firoze-hossain/nova-player"

[features]
default = ["std"]
std = ["nova-player-core/std"]

[dependencies]
nova-player-core = { path = "../nova-player-core", default-features = false }
